<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "ISI_APIKEY_KAMU",
  authDomain: "tomyshop-df22d.firebaseapp.com",
  databaseURL: "https://tomyshop-df22d-default-rtdb.firebaseio.com",
  projectId: "tomyshop-df22d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ================= PRODUK ================= */

// TAMBAH PRODUK
window.tambahProduk = function(){
  if(!window.currentUser || window.currentUser.user!=="admin") return alert("Admin only!");

  push(ref(db,"produk"),{
    nama: pNama.value,
    harga: pHarga.value,
    gambar: pGambar.value
  });
}

// TAMPILKAN PRODUK REALTIME
onValue(ref(db,"produk"),(snapshot)=>{
  const data = snapshot.val();
  listProduk.innerHTML="";

  if(!data) return;

  Object.entries(data).forEach(([id,p])=>{
    let tombolHapus = "";

    if(window.currentUser && window.currentUser.user==="admin"){
      tombolHapus = `<button onclick="hapusProduk('${id}')">Hapus</button>`;
    }

    listProduk.innerHTML += `
    <div class="product">
      <img src="${p.gambar}">
      <h4>${p.nama}</h4>
      <p>Rp ${p.harga}</p>
      <button onclick="beliProdukFirebase('${id}','${p.nama}','${p.harga}')">Beli</button>
      ${tombolHapus}
    </div>`;
  });
});

// HAPUS PRODUK
window.hapusProduk = function(id){
  remove(ref(db,"produk/"+id));
}

/* ================= BELI ================= */

window.beliProdukFirebase = function(id,nama,harga){
  if(!window.currentUser) return alert("Login dulu!");
  window.produkDipilih = {nama,harga};
  buyNama.innerText=nama;
  buyBox.style.display="block";
}

/* ================= ORDER ================= */

window.checkout = function(){
  if(!alamat.value || !metode.value) return alert("Isi semua!");

  push(ref(db,"orders"),{
    user: window.currentUser.user,
    produk: window.produkDipilih.nama,
    harga: window.produkDipilih.harga,
    alamat: alamat.value,
    metode: metode.value,
    status:"Menunggu"
  });

  alert("Pesanan masuk!");
  buyBox.style.display="none";
  alamat.value="";
}

// TAMPILKAN ORDER ADMIN
onValue(ref(db,"orders"),(snapshot)=>{
  const data = snapshot.val();
  listOrder.innerHTML="";

  if(!data) return;

  Object.entries(data).forEach(([id,o])=>{
    listOrder.innerHTML+=`
    <div class="product">
      <h4>${o.produk}</h4>
      <p>Status: ${o.status}</p>
    </div>`;
  });
});

</script>
